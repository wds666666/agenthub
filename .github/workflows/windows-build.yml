name: Windows packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64 (NSIS + MSI)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-x64

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.12.0 --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and verify Windows packages
        shell: pwsh
        run: ./scripts/package-windows.ps1 -SkipInstall

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: AgentHub-${{ github.ref_name }}-windows-x64
          if-no-files-found: error
          retention-days: 30
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/SHA256SUMS.windows.txt
            target/release/agenthub.exe
            target/release/agenthub-desktop.exe
