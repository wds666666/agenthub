name: Windows packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64 (NSIS + MSI)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.3.4
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-x64

      - name: Install Tauri CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "cargo-tauri.zip"
          $extract = Join-Path $env:RUNNER_TEMP "cargo-tauri"
          Invoke-WebRequest -Uri "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.12.0/cargo-tauri-x86_64-pc-windows-msvc.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $bin = Get-ChildItem $extract -Recurse -Filter cargo-tauri.exe | Select-Object -First 1
          if (-not $bin) { throw "cargo-tauri.exe was not found in the release archive" }
          $destDir = Join-Path $env:USERPROFILE ".cargo\bin"
          New-Item -ItemType Directory -Force -Path $destDir | Out-Null
          Copy-Item $bin.FullName (Join-Path $destDir "cargo-tauri.exe") -Force
          & "$destDir\cargo-tauri.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "Tauri CLI failed to start" }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and verify Windows packages
        shell: pwsh
        run: ./scripts/package-windows.ps1 -SkipInstall

      - name: Upload Windows packages
        uses: actions/upload-artifact@v7
        with:
          name: AgentHub-${{ github.ref_name }}-windows-x64
          if-no-files-found: error
          retention-days: 30
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/SHA256SUMS.windows.txt
            target/release/agenthub.exe
            target/release/agenthub-desktop.exe
