name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (for example v0.1.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  linux-x64:
    name: Ubuntu x64 (deb + AppImage + CLI)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf file

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.3.4
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-x64

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.12.0 --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: |
          pnpm lint
          pnpm test
          cargo fmt --all -- --check
          cargo clippy -p agenthub-core -p agenthub-cli --all-targets -- -D warnings
          cargo test -p agenthub-core

      - name: Build CLI and desktop bundles
        run: |
          cargo build --release -p agenthub-cli
          cargo tauri build --bundles deb,appimage

      - name: Collect Linux artifacts
        run: |
          set -euo pipefail
          out=dist-release
          mkdir -p "$out"
          version="${RELEASE_TAG#v}"
          cp target/release/bundle/deb/*.deb "$out/"
          cp target/release/bundle/appimage/*.AppImage "$out/"
          cp target/release/agenthub "$out/agenthub-cli-${version}-linux-x64"
          cp target/release/agenthub-desktop "$out/agenthub-desktop-${version}-linux-x64"
          chmod +x "$out"/*.AppImage "$out"/agenthub-*-linux-x64
          (cd "$out" && sha256sum * > SHA256SUMS.linux.txt)
          ls -l "$out"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          if-no-files-found: error
          retention-days: 14
          path: dist-release/*

  windows-x64:
    name: Windows x64 (NSIS + MSI + CLI)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.3.4
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-x64

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.12.0 --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and verify Windows packages
        shell: pwsh
        run: ./scripts/package-windows.ps1 -SkipInstall

      - name: Collect Windows artifacts
        shell: pwsh
        run: |
          $out = "dist-release"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $version = $env:RELEASE_TAG.TrimStart("v")
          Copy-Item target/release/bundle/nsis/*-setup.exe $out
          Copy-Item target/release/bundle/msi/*.msi $out
          Copy-Item target/release/agenthub.exe "$out/agenthub-cli-$version-windows-x64.exe"
          Copy-Item target/release/agenthub-desktop.exe "$out/agenthub-desktop-$version-windows-x64-portable.exe"
          Get-ChildItem $out -File | ForEach-Object {
            "$((Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content -Encoding ascii "$out/SHA256SUMS.windows.txt"
          Get-ChildItem $out

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          if-no-files-found: error
          retention-days: 14
          path: dist-release/*

  publish:
    name: Publish GitHub Release
    needs: [linux-x64, windows-x64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -l release-assets
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --target "${{ github.sha }}" \
              --title "AgentHub $RELEASE_TAG" \
              --notes "Ubuntu x64: .deb / AppImage / CLI. Windows x64: NSIS setup / MSI / CLI. Windows builds are unsigned; SmartScreen may warn. Verify downloads with the SHA256SUMS files."
          fi
