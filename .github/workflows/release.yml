name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create for the selected ref (for example v0.1.0). Does not check out a different commit."
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  linux-x64:
    name: Ubuntu x64 (deb + CLI)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf file

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.3.4
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-x64

      - name: Install Tauri CLI
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/cargo-tauri.tgz \
            https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.12.0/cargo-tauri-x86_64-unknown-linux-gnu.tgz
          tar -xzf /tmp/cargo-tauri.tgz -C /tmp
          bin="$(find /tmp -maxdepth 3 -type f -name cargo-tauri -print -quit)"
          test -n "$bin"
          install -m 0755 "$bin" "$HOME/.local/bin/cargo-tauri"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          cargo-tauri --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: |
          pnpm lint
          pnpm test
          cargo fmt --all -- --check
          cargo clippy -p agenthub-core -p agenthub-cli --all-targets -- -D warnings
          cargo test -p agenthub-core

      - name: Build CLI and desktop bundles
        run: |
          set -euo pipefail
          cargo build --release -p agenthub-cli
          # ubuntu-24.04 runners cannot reliably run linuxdeploy (it is an AppImage,
          # FUSE is blocked, and its bundled strip rejects modern glibc). Publish
          # the .deb plus the raw executables instead of failing the release there.
          cargo tauri build --bundles deb

      - name: Collect Linux artifacts
        run: |
          set -euo pipefail
          out=dist-release
          mkdir -p "$out"
          version="${RELEASE_TAG#v}"
          cp target/release/bundle/deb/*.deb "$out/"
          cp target/release/agenthub "$out/agenthub-cli-${version}-linux-x64"
          cp target/release/agenthub-desktop "$out/agenthub-desktop-${version}-linux-x64"
          chmod +x "$out"/agenthub-*-linux-x64
          (cd "$out" && sha256sum -- * > SHA256SUMS.linux.txt)
          ls -l "$out"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          if-no-files-found: error
          retention-days: 14
          path: dist-release/*

  windows-x64:
    name: Windows x64 (NSIS + MSI + CLI)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.3.4
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-x64

      - name: Install Tauri CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "cargo-tauri.zip"
          $extract = Join-Path $env:RUNNER_TEMP "cargo-tauri"
          Invoke-WebRequest -Uri "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.12.0/cargo-tauri-x86_64-pc-windows-msvc.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $bin = Get-ChildItem $extract -Recurse -Filter cargo-tauri.exe | Select-Object -First 1
          if (-not $bin) { throw "cargo-tauri.exe was not found in the release archive" }
          $destDir = Join-Path $env:USERPROFILE ".cargo\bin"
          New-Item -ItemType Directory -Force -Path $destDir | Out-Null
          Copy-Item $bin.FullName (Join-Path $destDir "cargo-tauri.exe") -Force
          & "$destDir\cargo-tauri.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "Tauri CLI failed to start" }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and verify Windows packages
        shell: pwsh
        run: ./scripts/package-windows.ps1 -SkipInstall

      - name: Collect Windows artifacts
        shell: pwsh
        run: |
          $out = "dist-release"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $version = if ($env:RELEASE_TAG.StartsWith("v")) { $env:RELEASE_TAG.Substring(1) } else { $env:RELEASE_TAG }
          Copy-Item target/release/bundle/nsis/*-setup.exe $out
          Copy-Item target/release/bundle/msi/*.msi $out
          Copy-Item target/release/agenthub.exe "$out/agenthub-cli-$version-windows-x64.exe"
          Copy-Item target/release/agenthub-desktop.exe "$out/agenthub-desktop-$version-windows-x64-portable.exe"
          Get-ChildItem $out -File | ForEach-Object {
            "$((Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content -Encoding ascii "$out/SHA256SUMS.windows.txt"
          Get-ChildItem $out

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          if-no-files-found: error
          retention-days: 14
          path: dist-release/*

  publish:
    name: Publish GitHub Release
    needs: [linux-x64, windows-x64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -l release-assets
          if tag_json=$(gh api "repos/${GH_REPO}/git/ref/tags/${RELEASE_TAG}" 2>/dev/null); then
            tag_type=$(jq -r .object.type <<<"$tag_json")
            tag_sha=$(jq -r .object.sha <<<"$tag_json")
            if [[ "$tag_type" == "tag" ]]; then
              tag_sha=$(gh api "repos/${GH_REPO}/git/tags/${tag_sha}" --jq .object.sha)
            fi
            if [[ "$tag_sha" != "${GITHUB_SHA}" ]]; then
              echo "Refusing to publish: ${RELEASE_TAG} points at ${tag_sha}, this build is ${GITHUB_SHA}."
              exit 1
            fi
          fi
          notes="Ubuntu x64: .deb, agenthub-desktop, and agenthub CLI. Windows x64: NSIS setup, MSI, portable agenthub-desktop, and agenthub CLI. AppImage is omitted because linuxdeploy cannot run on GitHub-hosted Ubuntu 24.04. Windows builds are unsigned; SmartScreen may warn. Verify downloads with the SHA256SUMS files."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --target "${GITHUB_SHA}" \
              --title "AgentHub $RELEASE_TAG" \
              --notes "$notes"
          fi
