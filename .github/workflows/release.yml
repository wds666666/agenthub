name: Publish release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Successful all-platform Build packages run at the selected commit"
        required: true
        type: string
      tag:
        description: "Optional: defaults to the selected version tag; never increments the package version"
        required: false
        type: string
      approved:
        description: "User explicitly approved this publication"
        type: boolean
        default: false
      replace_existing:
        description: "User explicitly approved replacing this release and its tag"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Publish explicitly approved build
    if: ${{ inputs.approved == true }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Validate package and release notes
        id: metadata
        env:
          REQUESTED_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: python3 scripts/check_project.py --release-tag "$REQUESTED_TAG" --publish --github-output
      - name: Verify source build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/${GH_REPO}/actions/runs/${BUILD_RUN_ID}" > "$RUNNER_TEMP/source-build.json"
          gh api "repos/${GH_REPO}/actions/runs/${BUILD_RUN_ID}/artifacts" > "$RUNNER_TEMP/source-artifacts.json"
          python3 - <<'PYTHON'
          import json, os, pathlib
          run = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "source-build.json").read_text())
          assert run["conclusion"] == "success" and run["status"] == "completed", "Build must finish successfully"
          assert run["head_sha"] == os.environ["GITHUB_SHA"], "Build and publication commits must match"
          assert run["path"] == ".github/workflows/build.yml", "Use the Build packages workflow"
          artifacts = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "source-artifacts.json").read_text())["artifacts"]
          assert sorted(a["name"] for a in artifacts) == ["linux-x64", "windows-x64"], "Both platform artifacts are required"
          assert all(not a["expired"] for a in artifacts), "Artifacts have expired; rebuild first"
          PYTHON
      - name: Download verified build artifacts
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}
          path: release-assets
          merge-multiple: true
      - name: Verify package checksums
        run: |
          set -euo pipefail
          cd release-assets
          for platform in linux windows; do
            sed 's/\r$//' "SHA256SUMS.${platform}.txt" > "$RUNNER_TEMP/checksums-${platform}.txt"
            sha256sum -c "$RUNNER_TEMP/checksums-${platform}.txt"
          done
      - name: Create or explicitly replace release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          REPLACE_EXISTING: ${{ inputs.replace_existing }}
        run: |
          set -euo pipefail
          existing_release=false
          if gh release view "$RELEASE_TAG" --json tagName > "$RUNNER_TEMP/previous-release.json" 2>/dev/null; then
            existing_release=true
            [[ "$REPLACE_EXISTING" == "true" ]] || { echo 'Existing release requires explicit replacement approval.'; exit 1; }
          fi
          tag_exists=false
          if tag_json=$(gh api "repos/${GH_REPO}/git/ref/tags/${RELEASE_TAG}" 2>/dev/null); then
            tag_exists=true
            tag_type=$(jq -r .object.type <<<"$tag_json")
            tag_sha=$(jq -r .object.sha <<<"$tag_json")
            if [[ "$tag_type" == "tag" ]]; then
              tag_sha=$(gh api "repos/${GH_REPO}/git/tags/${tag_sha}" --jq .object.sha)
            fi
            if [[ "$tag_sha" != "${GITHUB_SHA}" && "$REPLACE_EXISTING" != "true" ]]; then
              echo 'Tag points to another commit; explicit replacement approval is required.'
              exit 1
            fi
          fi
          if [[ "$existing_release" == "true" ]]; then
            gh release delete "$RELEASE_TAG" --yes
          fi
          if [[ "$tag_exists" == "true" && "$tag_sha" != "${GITHUB_SHA}" ]]; then
            gh api --method PATCH "repos/${GH_REPO}/git/refs/tags/${RELEASE_TAG}" \
              -f sha="$GITHUB_SHA" -F force=true > /dev/null
          fi
          gh release create "$RELEASE_TAG" release-assets/* --latest \
            --target "$GITHUB_SHA" --title "AgentHub $RELEASE_TAG" \
            --notes-file "docs/releases/${RELEASE_TAG}.md"
